{% extends 'base.html' %}
{% block title %}{{ action }} Curso{% endblock %}

{% block content %}
<div class="page-header fade-in">
  <div>
    <div class="breadcrumb">
      <a href="{% url 'dashboard' %}">Dashboard</a>
      <span class="breadcrumb-sep">›</span>
      <span>{{ action }} Curso</span>
    </div>
    <h1 class="page-title">{{ action }} Curso</h1>
  </div>
</div>

<div class="form-container fade-in">
  <div class="card">
    <form method="POST">
      {% csrf_token %}
      
      <div class="form-group">
        <label class="form-label" for="id_title">Nombre del curso *</label>
        <input type="text" name="title" id="id_title" class="form-control"
          value="{{ form.title.value|default:'' }}"
          placeholder="Ej: Matematicas Discretas 2024" required>
        {% for error in form.title.errors %}<p class="form-error">{{ error }}</p>{% endfor %}
      </div>
      
      <div class="form-group">
        <label class="form-label" for="id_description">Descripcion</label>
        <textarea name="description" id="id_description" class="form-control" rows="3"
          placeholder="Breve descripcion del curso...">{{ form.description.value|default:'' }}</textarea>
      </div>
      
      <div class="form-group">
        <label class="form-label">Color del curso</label>
        <div class="color-picker-container">
          {% for color in colors %}
            <label>
              <input type="radio" name="cover_color" value="{{ color }}"
                class="color-radio"
                {% if forloop.first %}checked{% endif %}>
              <div class="color-swatch" style="background:{{ color }};" title="{{ color }}"></div>
            </label>
          {% endfor %}
        </div>
      </div>
      
      <div style="display:flex; gap:0.75rem; margin-top:1.5rem;">
        <button type="submit" id="btn-save-course" class="btn btn-primary btn-lg" style="flex:1;">
          {{ action }} Curso
        </button>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary btn-lg">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
