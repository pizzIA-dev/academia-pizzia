{% extends 'base.html' %}
{% block title %}Eliminar {{ type|capfirst }}{% endblock %}

{% block content %}
<div class="form-container fade-in" style="padding-top:3rem; max-width:520px;">
  <div class="card" style="text-align:center; border-color:rgba(239,68,68,0.3);">
    <div style="font-size:3rem; margin-bottom:1rem;"><i data-lucide="trash-2" class="icon icon-2xl"></i></div>
    <h2 style="font-weight:800; margin-bottom:0.5rem;">Eliminar {{ type }}</h2>
    <p style="color:var(--text-secondary); margin-bottom:0.25rem;">
      Esta a punto de eliminar:
    </p>
    <div style="font-size:1.05rem; font-weight:700; color:var(--danger); margin:0.75rem 0 1.5rem;">
      "{{ object }}"
    </div>
    <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:1.5rem;">
      Esta accion no se puede deshacer.
    </p>
    <div style="display:flex; gap:0.75rem; justify-content:center;">
      <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger btn-lg" id="btn-confirm-delete">
          Si, eliminar
        </button>
      </form>
      <a href="{% url cancel_url cancel_pk %}" class="btn btn-secondary btn-lg">Cancelar</a>
    </div>
  </div>
</div>
{% endblock %}
